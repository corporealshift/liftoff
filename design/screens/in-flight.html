<!doctype html>
<!-- Mockup, 390x844 phone frame, direction B "Space Age". See design/README.md. Sample data only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liftoff · In flight</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C23F14}a:hover{color:#8F2E0E}
button{font:inherit;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2EADB; color: #1D1B19; font-family: 'Work Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #1F5F6B; color: #F2EADB; padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: #E3A72F">IN FLIGHT · SORTIE 2</span>
        <h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 44px; line-height: 0.95; text-transform: uppercase">Push + core</h1>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; line-height: 0.9">
        <span style="font-size: 44px; color: #E3A72F">05<span style="font-size: 22px; color: #F2EADB">/14</span></span>
        <span style="font-size: 13px; letter-spacing: 0.14em; color: #F2EADB">SETS</span>
      </div>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px">
      <span style="height: 10px; box-sizing: border-box; background: #E3A72F; border: 1.5px solid #E3A72F"></span>
      <span style="height: 10px; box-sizing: border-box; background: #E3A72F; border: 1.5px solid #E3A72F"></span>
      <span style="height: 10px; box-sizing: border-box; background: #E3A72F; border: 1.5px solid #E3A72F"></span>
      <span style="height: 10px; box-sizing: border-box; background: #E3A72F; border: 1.5px solid #E3A72F"></span>
      <span style="height: 10px; box-sizing: border-box; background: #E3A72F; border: 1.5px solid #E3A72F"></span>
      <span style="height: 10px; box-sizing: border-box; border: 1.5px solid #9FBFC4"></span>
      <span style="height: 10px; box-sizing: border-box; border: 1.5px solid #9FBFC4"></span>
      <span style="height: 10px; box-sizing: border-box; border: 1.5px solid #9FBFC4"></span>
      <span style="height: 10px; box-sizing: border-box; border: 1.5px solid #9FBFC4"></span>
      <span style="height: 10px; box-sizing: border-box; border: 1.5px solid #9FBFC4"></span>
      <span style="height: 10px; box-sizing: border-box; border: 1.5px solid #9FBFC4"></span>
      <span style="height: 10px; box-sizing: border-box; border: 1.5px solid #9FBFC4"></span>
      <span style="height: 10px; box-sizing: border-box; border: 1.5px solid #9FBFC4"></span>
      <span style="height: 10px; box-sizing: border-box; border: 1.5px solid #9FBFC4"></span>
    </div>
  </header>
  <div aria-hidden="true" style="display: flex; flex-direction: column">
    <span style="height: 5px; background: #E3A72F"></span>
    <span style="height: 5px; background: #C23F14"></span>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <section style="border: 2px solid #1D1B19; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #E8DFCD">
      <span style="display: flex; align-items: baseline; gap: 10px"><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 16px; color: #5E5850">01</span><span style="font-size: 16px; font-weight: 500; color: #5E5850; text-decoration: line-through">Bench press</span></span>
      <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 18px; color: #1F5F6B; letter-spacing: 0.06em">3/3 LANDED</span>
    </section>

    <section style="border: 2px solid #1D1B19; box-shadow: 4px 4px 0 #1D1B19; background: #FBF6EC">
      <div style="background: #1D1B19; color: #F2EADB; padding: 10px 14px; display: flex; align-items: baseline; gap: 10px">
        <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 16px; color: #E3A72F">02</span>
        <h2 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase">Seated DB shoulder press</h2>
      </div>
      <div style="padding: 4px 14px 4px">
        <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr) 48px; align-items: center; gap: 8px; height: 58px; border-bottom: 1px solid #CFC6B6">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #5E5850">SET 1</span>
          <button aria-label="Edit set 1 weight" style="background: none; border: none; padding: 0; text-align: left; color: #1D1B19; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">35 LB</button>
          <button aria-label="Edit set 1 reps" style="background: none; border: none; padding: 0; text-align: left; color: #1D1B19; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">× 10</button>
          <button aria-label="Set 1 done" style="width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #1D1B19; border-radius: 4px; background: #C23F14; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5L20 7"></path></svg></button>
        </div>
        <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr) 48px; align-items: center; gap: 8px; height: 58px; border-bottom: 1px solid #CFC6B6">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #5E5850">SET 2</span>
          <button aria-label="Edit set 2 weight" style="background: none; border: none; padding: 0; text-align: left; color: #1D1B19; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">35 LB</button>
          <button aria-label="Edit set 2 reps" style="background: none; border: none; padding: 0; text-align: left; color: #C23F14; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px; display: flex; align-items: baseline; gap: 6px">× 8<span style="font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 11px; color: #5E5850">of 10</span></button>
          <button aria-label="Set 2 done" style="width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #1D1B19; border-radius: 4px; background: #C23F14; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5L20 7"></path></svg></button>
        </div>
        <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr) 48px; align-items: center; gap: 8px; height: 58px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #C23F14">SET 3</span>
          <button aria-label="Edit set 3 weight" style="background: none; border: none; padding: 0; text-align: left; color: #1D1B19; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">35 LB</button>
          <button aria-label="Edit set 3 reps" style="background: none; border: none; padding: 0; text-align: left; color: #1D1B19; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">× 10</button>
          <button aria-label="Check off set 3" style="width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #1D1B19; border-radius: 4px; background: #FFFFFF; padding: 0"></button>
        </div>
      </div>
      <div style="display: flex; border-top: 2px solid #1D1B19">
        <button style="flex: 1 1 0; height: 44px; background: none; border: none; border-right: 1px solid #1D1B19; color: #1D1B19; font-size: 14px; font-weight: 600">+ Add set</button>
        <button style="flex: 1 1 0; height: 44px; background: none; border: none; border-right: 1px solid #1D1B19; color: #1D1B19; font-size: 14px; font-weight: 600">Note</button>
        <button style="flex: 1 1 0; height: 44px; background: none; border: none; color: #1D1B19; font-size: 14px; font-weight: 600">Skip</button>
      </div>
    </section>

    <section style="border: 2px solid #1D1B19; background: #FBF6EC">
      <div style="background: #1D1B19; color: #F2EADB; padding: 10px 14px; display: flex; align-items: baseline; gap: 10px">
        <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 16px; color: #E3A72F">03</span>
        <h2 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase">Dip</h2>
      </div>
      <div style="padding: 4px 14px">
        <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr) 48px; align-items: center; gap: 8px; height: 58px; border-bottom: 1px solid #CFC6B6">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #5E5850">SET 1</span>
          <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">BW</span>
          <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">× 8</span>
          <button aria-label="Check off set 1" style="width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #1D1B19; border-radius: 4px; background: #FFFFFF; padding: 0"></button>
        </div>
        <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 1fr) 48px; align-items: center; gap: 8px; height: 58px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #5E5850">SET 2</span>
          <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">BW</span>
          <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px">× 8</span>
          <button aria-label="Check off set 2" style="width: 48px; height: 48px; box-sizing: border-box; border: 2px solid #1D1B19; border-radius: 4px; background: #FFFFFF; padding: 0"></button>
        </div>
      </div>
    </section>
  </div>

  <footer style="padding: 14px 20px 20px; border-top: 3px solid #1D1B19; background: #F2EADB">
    <button style="width: 100%; height: 64px; box-sizing: border-box; border: 2px solid #1D1B19; border-radius: 4px; background: #1D1B19; color: #F2EADB; box-shadow: 4px 4px 0 #C23F14; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 30px; letter-spacing: 0.16em; display: flex; align-items: center; justify-content: center; gap: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"></path></svg>
      LAND
    </button>
  </footer>
</div>
</body>
</html>
